[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protomaml-ddos"
version = "0.1.0"
description = "First-order episodic ProtoMAML research implementation for binary DDoS flow classification"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{name = "Research software contributors"}]
dependencies = ["torch>=2.2", "numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.4", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=9", "build>=1.2"]

[project.urls]
Repository = "https://github.com/AliAlfatemi/protomaml-ddos"
Paper = "https://doi.org/10.1109/IWCMC65282.2025.11059701"
Issues = "https://github.com/AliAlfatemi/protomaml-ddos/issues"

[project.scripts]
protomaml-ddos = "protomaml.cli:main"

[tool.setuptools.packages.find]
include = ["protomaml", "protomaml.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
